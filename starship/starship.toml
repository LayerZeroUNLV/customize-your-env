# Starship prompt config for the Customize Your Coding Environment workshop
# Location: ~/.config/starship.toml (same path on Windows, mac and linux)
# Every module and option: https://starship.rs/config/
# Ready made looks: starship preset --list

"$schema" = 'https://starship.rs/config-schema.json'

# Pick the colors below by name, swap this to try another palette
palette = "catppuccin_mocha"

# Two line prompt, info on top and the arrow you type after on the bottom
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$java\
$c\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[os]
disabled = false
style = "fg:blue"
format = "[$symbol ]($style)"

# Nerd Font logos per OS
[os.symbols]
Windows = "\ue70f"
Macos = "\ue711"
Linux = "\uf17c"
Arch = "\uf303"
Ubuntu = "\uf31b"
Fedora = "\uf30a"
Debian = "\uf306"
Mint = "\uf30e"

[username]
show_always = false
style_user = "fg:mauve bold"
format = "[$user ]($style)"

[directory]
style = "fg:lavender bold"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path ]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "\ue725 "
style = "fg:pink"
format = "[$symbol$branch ]($style)"

[git_status]
style = "fg:red"
format = "[$all_status$ahead_behind ]($style)"

[python]
symbol = "\ue73c "
style = "fg:yellow"
format = "[$symbol$version ]($style)"

[nodejs]
symbol = "\ue718 "
style = "fg:green"
format = "[$symbol$version ]($style)"

[rust]
symbol = "\ue7a8 "
style = "fg:peach"
format = "[$symbol$version ]($style)"

[java]
symbol = "\ue738 "
style = "fg:red"
format = "[$symbol$version ]($style)"

[c]
symbol = "\ue61e "
style = "fg:sapphire"
format = "[$symbol$version ]($style)"

[cmd_duration]
min_time = 2000
style = "fg:subtext0"
format = "[took $duration]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
